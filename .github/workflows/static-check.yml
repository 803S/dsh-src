name: static-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全量历史：敏感信息扫描要覆盖旧提交
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check (node --check)
        run: |
          for f in lib/*.js scripts/*.mjs tools/*.mjs tests/*.mjs; do
            node --check "$f"
          done

      - name: Preset consistency (persona×toolFilter)
        run: node scripts/check-preset-consistency.mjs

      - name: Reject private network addresses (RFC1918 / loopback ranges in docs & code)
        run: |
          # 允许：127.0.0.1（本机示例）、0.0.0.0、192.0.2.x（TEST-NET-1 文档地址）
          # 禁止：10/8、172.16/12、192.168/16 及其他真实内网段出现在任何被追踪文件里
          if grep -rInE '\b(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3})\b' \
              --include='*.md' --include='*.mjs' --include='*.js' --include='*.yml' --include='*.yaml' --include='*.json' \
              . | grep -v node_modules; then
            echo "::error::发现内网 IP——请改用 RFC 5737 文档地址（192.0.2.x）"
            exit 1
          fi

      - name: Reject potential secrets
        run: |
          if grep -rInE '(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{30,}|xox[bp]-[a-zA-Z0-9-]{10,})' \
              --include='*.md' --include='*.mjs' --include='*.js' --include='*.yml' --include='*.yaml' --include='*.json' \
              . | grep -v node_modules; then
            echo "::error::疑似 API key 泄露"
            exit 1
          fi

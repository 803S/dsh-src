name: static-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check (node --check)
        run: |
          for f in lib/*.js scripts/*.mjs tools/*.mjs tests/*.mjs; do
            node --check "$f"
          done

      - name: Preset consistency (persona×toolFilter)
        run: node scripts/check-preset-consistency.mjs

      - name: 源码私网地址与凭据检查（不回显凭据）
        run: node scripts/check-source-hygiene.mjs

    scripts: []
    when: SRC 目标规划、接口建模、越权/认证链、注入/SSRF/XSS/上传/业务逻辑测试、攻击链升阶与报告证据审查
  - id: wechat-mp-reader
    from: path:/Users/lihua-dis/Software/dsh-src/skills/wechat-mp-reader
    kind: skill
    when: 需要读取微信公众号文章全文（漏洞方法论/技术文章）时；curl+浏览器 UA 直抓服务端渲染正文，无需 headless
  - id: wx-minapp-recon
    from: path:/Users/lihua-dis/Software/dsh-src/skills/wx-minapp-recon
    kind: skill
    when: 目标含微信小程序资产需要逆向审计时：扫描本机微信缓存 wxapkg 包、wedecode 反编译、提取 API/参数/敏感信息/云开发环境 ID。前提是本机微信已打开过目标小程序（含登录态）——先 src_user_todo 提待办让用户打开并确认登录，再扫包逆向
  - id: src-rules-scraper
    from: path:/Users/lihua-dis/Software/dsh-src/skills/src-rules-scraper
    kind: skill
    when: 抓取厂商 SRC 平台的测试范围/规则/奖励标准时；SPA+JSON API 通用方法论（美团/小米已验证），与 wechat-mp-reader 衔接
  - id: fofa
    from: path:/Users/lihua-dis/Software/dsh-src/mcp-servers/fofa_MCP
    entry: fofa-launcher.mjs
    enabled: true
    when: 当前授权 SRC 目标的 FOFA 资产搜索；遵守 dsh-src 的资产边界、单种子闭环、限流和证据记录规则
  - id: playwright
    from: npm:@playwright/mcp
    kind: mcp
    when: 需要真实浏览器执行 JS 的交互验证：SPA 路由内点击/表单提交、DOM XSS 触发验证、登录流程操作、前端渲染内容断言。对不需要人机验证的流程可完全自动，顶象滑块等强人机验证仍需人工。

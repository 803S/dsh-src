# 可公开的能力声明快照，不存凭据；实际运行配置为 $DSH_HOME/capabilities.yaml（默认 ~/.dsh）。
# 在运行配置中填写密钥和本机路径，不得将其复制或提交回源码仓库。
settings:
  proxy: ""
  fofaUv: /Users/lihua-dis/.local/bin/uv
  fofaEmail: ""
  fofaKey: ""
  fofaKeyBackup: ""
  fofaEmailBackup2: ""
  fofaKeyBackup2: ""

capabilities:
  - id: clown-src-playbook
    from: path:/Users/lihua-dis/Software/dsh-src/skills/clown-src-playbook
    kind: skill
    docs: DSH-ADAPTER.md
    scripts: []
    when: SRC 目标规划、接口建模、越权/认证链、注入/SSRF/XSS/上传/业务逻辑测试、攻击链升阶与报告证据审查
  - id: wechat-mp-reader
    from: path:/Users/lihua-dis/Software/dsh-src/skills/wechat-mp-reader
    kind: skill
    when: 需要读取微信公众号文章全文（漏洞方法论/技术文章）时；curl+浏览器 UA 直抓服务端渲染正文，无需 headless
  - id: wx-minapp-recon
    from: path:/Users/lihua-dis/Software/dsh-src/skills/wx-minapp-recon
    kind: skill
    scripts: [scripts/scan_wxapkg.py, scripts/run_decompile.py, scripts/extract_minapp.py, scripts/group_apis.py]
    when: 目标含微信小程序资产需要逆向审计时：先建 manual-test 待办请用户在微信打开目标小程序并确认登录（src_user_todo，本地 2026-09 拆触发器引擎后由 agent 自行挂），再扫描本机微信缓存 wxapkg 包、wedecode 反编译、提取 API/参数/敏感信息/云开发环境 ID。扫包为空说明用户还没打开过，提醒用户完成后重扫，不虚构包路径
  - id: src-rules-scraper
    from: path:/Users/lihua-dis/Software/dsh-src/skills/src-rules-scraper
    kind: skill
    when: 抓取厂商 SRC 平台的测试范围/规则/奖励标准时；SPA+JSON API 通用方法论（美团/小米已验证），与 wechat-mp-reader 衔接
  - id: fofa
    from: path:/Users/lihua-dis/Software/dsh-src/mcp-servers/fofa_MCP
    entry: fofa-launcher.mjs
    enabled: true
    when: 当前授权 SRC 目标的 FOFA 资产搜索；遵守 dsh-src 的资产边界、单种子闭环、限流和证据记录规则
  - id: playwright
    from: npm:@playwright/mcp
    kind: mcp
    when: 需要真实浏览器执行 JS 的交互验证：SPA 路由内点击/表单提交、DOM XSS 触发验证、登录流程操作、前端渲染内容断言。对不需要人机验证的流程可完全自动，顶象滑块等强人机验证仍需人工。

# The dsh-src bundle patch: the penetration-testing surface over
# dsh-base + dsh-web-app. The bundle is one self-contained package — every
# row resolves to a subpath of the bundle package itself, so the whole thing
# installs from a single tarball via `dsh plugin add`.
#
# The patch contributes three things:
# 1. the sqlite backend row, as a subpath of this package;
# 2. the Web surface row (the per-session 渗透 view tab), whose client face is
#    the package's `./client` export;
# 3. a storage-domain route selecting the sqlite backend for the `src`
#    domain only — the override replaces the targeted row's whole config, so
#    the host default backend is restated here.
#
# The host src plugin belongs exclusively to the `src-hunter` agent preset.
# Registering it here as well duplicates its scoped tool catalog whenever that
# preset is selected, causing client command invalidation loops.

# Burp MCP 接线（默认注释：Burp 未运行时连接失败，宿主按退避策略自动重试）。
# 启用方法：复制下面整段到 profile 的 cordis.patch.yml（如 ~/.dsh/profiles/web/）并取消注释。
# 前置：桥脚本已装在 ~/.dsh/tools/burp-mcp-bridge.mjs（源码版本化在本仓 tools/ 下，直接 cp 过去即可）。
# [2026-08-23] 自愈桥替换 PortSwigger mcp-proxy.jar：jar 内 Kotlin SDK 长连 SSE 断掉后
# 进程存活但传输已死，后续调用全报 -32603 "SseClientTransport is not initialized!" 且无法自愈；
# 桥在任何请求失败后丢弃会话、下次调用自动开全新 SSE 会话重试一次，对上层透明。
# [local.13 实测仍适用] 扩展 SSE 端点在根路径 "/" 且仅支持 HTTP（默认 BURP_SSE_URL 同款）。
# - insert:
#     - id: mcp-burp
#       name: '@deepseek-ai/dsh-mcp-client'
#       config:
#         serverName: burp
#         transport: stdio
#         command: node
#         args: ['~/.dsh/tools/burp-mcp-bridge.mjs']
#         failOnStartupError: false
#         toolCallTimeoutMs: 120000

- insert:
    - id: ui-src
      name: '@howmp/dsh-src/ui-src'

    - id: storage-src-sqlite
      name: '@howmp/dsh-src/storage-sqlite'
      config:
        path: !!js dshHomePath('storages', 'src-sessions.db')

- id: storage-domain
  config:
    backend: json
    routes:
      pentest: sqlite
      src: src-sqlite

# DSH rc.6 replaces this row's configured roots with its bundled preset root
# during profile composition. `preset-root` adds this package's read-only root
# after `agent-presets` is constructed, without copying files into DSH_HOME.
- insert:
    - id: src-preset-root
      name: '@howmp/dsh-src/preset-root'

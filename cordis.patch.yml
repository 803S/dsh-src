# The dsh-src bundle patch: the penetration-testing surface over
# dsh-base + dsh-web-app. The bundle is one self-contained package — every
# row resolves inside the bundle package itself, so the whole thing installs
# from a single tarball via `dsh plugin add`.
#
# The patch contributes three things:
# 1. the sqlite backend row, as a subpath of this package;
# 2. the Web surface row (the per-session 渗透 view tab), whose host half is
#    the package's inert main entry and whose client face is the package's
#    `./client` export. The row name is the BARE package name on purpose:
#    dsh <= 0.1 identifies the client module by the row name, while dsh 0.2
#    normalizes every client entry onto its package-root specifier and skips
#    subpath rows entirely — a subpath row would silently never load the tab
#    on 0.2. The bundle registers under the same bare id (see PLUGIN_ID in
#    src/dsh-client-ui-src/tsdown.config.ts), so one row works on both.
# 3. a storage-domain route selecting the sqlite backend for the `src`
#    domain only — the override replaces the targeted row's whole config, so
#    the host default backend is restated here.
#
# The host src plugin belongs exclusively to the `src-hunter` agent preset.
# Registering it here as well duplicates its scoped tool catalog whenever that
# preset is selected, causing client command invalidation loops.

# Burp MCP 接线：由 caps-sync 自动写入 profile 的 cordis.patch.yml 标记区段（幂等，
# 重复跑不重复写），无需手动复制本块。桥脚本也由 caps-sync 自动安装到 ~/.dsh/tools/。
# [2026-08-23] 自愈桥替换 PortSwigger mcp-proxy.jar：jar 内 Kotlin SDK 长连 SSE 断掉后
# 进程存活但传输已死，后续调用全报 -32603 "SseClientTransport is not initialized!" 且无法自愈；
# 桥在任何请求失败后丢弃会话、下次调用自动开全新 SSE 会话重试一次，对上层透明。
# [local.13 实测仍适用] 扩展 SSE 端点在根路径 "/" 且仅支持 HTTP（默认 BURP_SSE_URL 同款）。
# - insert:
#     - id: mcp-burp
#       name: '@deepseek-ai/dsh-mcp-client'
#       config:
#         serverName: burp          # 必须叫 burp —— 工具名才是 mcp__burp__*
#         transport: stdio
#         command: bash             # bash -c 展开 $HOME；桥未装时提示后静默退出
#         args:
#           - '-c'
#           - 'B="$HOME/.dsh/tools/burp-mcp-bridge.mjs"; if [ -f "$B" ]; then exec node "$B"; fi'
#         failOnStartupError: false # Burp 未开时不阻塞其它功能
#         toolCallTimeoutMs: 120000

- insert:
    - id: ui-src
      name: '@lihua_dis/dsh-src'

    - id: storage-src-sqlite
      name: '@lihua_dis/dsh-src/storage-sqlite'
      config:
        path: !!js dshHomePath('storages', 'src-sessions.db')

- insert:
    - id: src-domain-admin
      name: '@lihua_dis/dsh-src/src-domain-admin'

- id: storage-domain
  config:
    backend: json
    routes:
      src: src-sqlite

# DSH rc.6 replaces this row's configured roots with its bundled preset root
# during profile composition. `preset-root` adds this package's read-only root
# after `agent-presets` is constructed, without copying files into DSH_HOME.
- insert:
    - id: src-preset-root
      name: '@lihua_dis/dsh-src/preset-root'

# dsh 0.2 的 preset 机制换代：0.2 没有 `agent-presets` 的 `resolvedRoots`（上面那条
# `src-preset-root` 在 0.2 上是空转，只服务 0.1），preset 改由「一条
# `@deepseek-ai/dsh-agent-preset` 声明行携带 `config.plugins` 行表」注册。这里用
# `cordis:include` 指向 0.1 用的同一份 `preset/src-hunter/agent.cordis.yml`（include 的 `path` 相对
# **profile 目录**解析，所以写成 `./node_modules/@lihua_dis/dsh-src/...`，指回同一份文件），于是
# 行表仍然只有一份真源、不会漂移：行里的 `!!js` 闸由两侧
# 各自求值——0.1 形态的行（persona 的 `text`）在 0.2 上被禁用，0.2 才有的行（command-goal /
# present / workflow-ptc）在 0.1 上被禁用。声明行自己也带同一判据的闸：0.1 不装
# `@deepseek-ai/dsh-agent-preset` ⇒ 闸判真 ⇒ 整行（连同子行表）在 0.1 上禁用；0.1 的 loader
# 对禁用行从不 import（`refresh()` 里 `if (this.disabled) return`），所以 0.1 上这个包名既不会
# 被解析也不会报错。`name`/`description`/`order` 必须与 preset/src-hunter/preset.yml 逐字一致，
# 由 scripts/check-preset-consistency.mjs 校验（下面三行是文件中唯一的手工副本）。
- insert:
    - id: preset-src-hunter
      name: '@deepseek-ai/dsh-agent-preset'
      disabled: !!js (function(){try{process.getBuiltinModule('node:module').createRequire(process.argv[1]).resolve('@deepseek-ai/dsh-agent-preset/package.json');return false}catch(error){return true}})()
      config:
        id: src-hunter
        name: SRC 专业模式
        description: 面向企业 SRC 的授权漏洞挖掘工作流：资产测绘、信息收集、漏洞验证、复核、报告与提交状态管理，并在 Web 中可视化展示。
        order: 2
        plugins:
          - id: preset-src-hunter-rows
            name: 'cordis:include'
            config:
              # include 的实现是 `new URL(path, ctx.baseUrl)`，而 baseUrl 是**profile 目录**
              # （不是本补丁文件所在目录）——写成 './preset/...' 会去 profile 里找而报
              # `config file not found`。插件就装在 profile 自己的 node_modules 里，所以这里
              # 用 profile 相对路径指回同一份行表（不复制、不落盘到 DSH_HOME）。
              path: './node_modules/@lihua_dis/dsh-src/preset/src-hunter/agent.cordis.yml'

# dsh-src local.100: keyless web search provider. It is deliberately inside the
# SRC plugin context so web_search has a usable provider without DeepSeek search key.
- id: web
  config:
    searchProvider: src-keyless-search

# SRC host gate owns the final bash spawn boundary, including full-access mode.
# The provider preserves native behavior for non-SRC sessions.
- insert:
    - id: src-egress
      name: '@lihua_dis/dsh-src/src-egress'

# `name` on a patch is an identity assertion, not a replacement field.
- id: bash-sandbox
  disabled: true
- insert:
    - id: src-bash-executor
      name: '@lihua_dis/dsh-src/src-bash-executor'

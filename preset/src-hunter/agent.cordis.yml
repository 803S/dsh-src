# The `src` agent preset: penetration-testing commander mode.
#
# A copy of the shipped `standard` preset with one addition — the
# @deepseek-ai/dsh-src row — and a commander persona. Everything else
# (shell, fs, skills, goals, delegation, workflows, ask-user, todo, web) is
# inherited unchanged, so the decision agent can delegate proposal and
# execution to subagents and keep every fact in the src_* records.
#
# AGENT-PLANE composition: the roster mounts this once under a standing
# scope; every session naming it joins by scope parentage. Service rows must
# sit inside an `isolate` realm; `dsh-src` publishes nothing (it registers
# model tools on the host `tools` registry, a `src:protocol` system-prompt
# section, and a `src` session-projection unit), and it consumes the host
# `storageDomain` facility — so the row sits loose, exactly like tool-bash.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
# The 提案→决策→执行 protocol itself arrives from the `src:protocol`
# system-prompt section contributed by the dsh-src package.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the penetration-testing commander (decision agent), powered by the {{model}} model.
      Your working directory is {{cwd}}. You decide and create exploration intents; proposal generation
      and execution are delegated to subagents, which submit confirmed results directly to their assigned intent.
      Follow the src:protocol system-prompt section exactly.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      # Web sessions should start in normal execution mode, not PTC/plan mode.
      disabled: true
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: src-recon-agent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: src_recon
        backgroundMode: continuable
        maxDepth: 1
        persona: |-
          你是 SRC 资产测绘执行 agent。只处理明确授权范围内的被动与低影响信息收集：域名/子域、IP、端口、服务、指纹、证书、公开页面与 JS 接口。禁止漏洞利用、账号爆破、拒绝服务和扩大范围。委派必须包含真实父 intentId；每发现一组新资产或事实立即调用 src_submit 检查点提交，不重复提交；提交资产时必须带 source（crt.sh/DNS/官网导航/JS bundle/手工确认等）、method、confidence 和 status（被动发现默认 candidate）。【授权边界=资产清单】探测类工具按「goal 主域内或资产清单内」放行：goal 主域外但要探测的 host，先 src_add_asset 登记（type/value/source 必填，source 写发现或归属判定依据；被动发现 status=candidate），登记后即可探测；报「outside the authorized goal host」＝该 host 未登记，判定属目标组织资产就登记后重试；判定拿不准（疑似但无法验证归属）不要硬登 confirmed——照常报 candidate（source 写存疑依据），并在 src_submit 摘要写「待归属确认：<注册域>（依据）」交父会话向用户发起确认，等待期间不要反复探测该域；确定不属于就停该方向并上报。全程使用中文。若某个工具报「不存在、未授权、requires an initialized SRC goal」类错误：这不是系统故障，不要用 bash echo 打检查点、不要反复重试同一调用、也不要改读经验库消磨回合——立即换用你确定可用的工具推进，或直接按异常流程收尾。中途异常或无法继续时，先把已完成的发现通过 src_submit 提交（stage=blocked/failed，summary 写明原因），再返回结论，不得静默退出。最终只返回结论、证据摘要、提交计数和未完成事项。
        toolFilter: &src-recon-filter
          deny: [src_add_capability, src_recover_child, src_update_finding, src_reject_finding, src_resolve_approval, src_request_asset_confirm, src_read_capability, src_run_capability, src_record_lesson, src_finalize_engagement, src_record_research, src_record_coverage, src_collect_passive, src_collect_dorks, src_import_traffic, src_scan_surface, src_record_observation, src_test_bypass, src_test_credential, src_user_todo, src_fetch_policy, src_set_infra, src_add_test_account, src_record_domain_note, src_set_goal_target, src_add_goal, src_add_intent, src_add_fact, src_add_finding, src_update_intent, src_state, src_graph, src_report, src_recon, src_audit, src_verify]

    - id: src-audit-agent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: src_audit
        backgroundMode: continuable
        maxDepth: 1
        persona: |-
          你是 SRC Web 漏洞检测执行 agent。只验证父 agent 指定的资产、漏洞假设与停止条件，重点关注越权、注入、SSRF、XSS、上传、业务逻辑与信息泄露；使用最小影响的 POC。【多账号交叉矩阵】会话配了多账号凭据时，执行交叉矩阵动作：A 的资源 ID × B 的会话、普通会话 × 管理端端点清单。双探规则：IDOR/越权类需两组不同 id 对确认系统性才提交，单组数据差可能是业务允许的差异。认证态流量独立计数（src_test_bypass 触顶返回 budgetExhausted 软信号→剩余矩阵格转待办，不要硬报错继续刷）；收到 sessionLikelyExpired 信号说明会话可能失效，转 manual/auth-session 待办交父会话，不反复重放失效凭据。【授权边界=资产清单】探测类工具按「goal 主域内或资产清单内」放行；遇「outside the authorized goal host and not in the asset inventory」报错：判定该 host 是否目标组织资产（品牌/控股/业务关联），是则 src_add_asset 登记（source 写判定依据）后重试一次；判定拿不准不要登记，在结论里报「待归属确认：<注册域>（依据）」交父会话处理；确定不属于则停止该方向并在结论说明——不要反复尝试同域其他 host。对 ai-surface 资产：先拉取页面内容做语义复核（判断是否真实 AI 服务：有对话/生成入口、模型 API 调用、流式响应——排除仅在营销文案提到 AI 的普通站点），复核为真再按 ai-abuse 假设自主推进——先读 lessons/ai-abuse 课程再定方案；优先测越权面（对话历史/分享链接 IDOR）与 key/端点暴露，再测间接注入与工具滥用（SSRF via URL-fetch 工具用 src_serve_proof 拿 OOB 回连证据）；套系统提示词只作为注入链的证据环节。验证注入时严守无害金丝雀纪律：用受限但无害的标记物证明能力，绝不真实生成违规内容，报告里只写「经构造可诱导生成 X 类内容」。复核为假则把 research 置 false-positive 并说明依据。需登录态/浏览器人工交互才能测的部分，通过 src_submit 提交 stage=blocked 检查点并在 summary 写明「建议父会话建 manual-test 待办」，不得静默跳过。未复现的内容只能作为 fact/hypothesis，不能写 finding。确认漏洞必须附可复现步骤，并立即通过 src_submit 提交检查点；finding 的 pocEvidence 必须包含可直接复现的 raw 请求/响应文本（至少含接口地址），不得仅给截图或描述。**finding 准入闸（服务端强制，缺项直接拒绝）**：每条 finding 必须同时给出危害链三要素——victimImpact（受害者视角：谁受害、要做什么或完全无交互、损失什么）、attackPrerequisites（利用前提：钓鱼页托管域要求/需登录哪个业务/需要的用户交互；前提不满足不得提交）、concreteLossEvidence（至少一条指向本会话真实 fact/observation/research 的 id，内容含敏感响应体或外带记录；仅头反射证据不算）——所以先把拿到的敏感响应用 facts 提交落图再引用其 id。仅配置缺陷、响应头反射而无敏感数据证明的信号不是漏洞：改记 research(false-positive) 或在 summary 里建议父会话建待办，severity 无 info 级。低危发现（如版本暴露）只要危害链闭合也可提交：如实定级并写清实际影响，不夸大不虚构；纯罗列信息而无任何危害论证的只能作为 fact。全程使用中文。若某个工具报「不存在、未授权、requires an initialized SRC goal」类错误：这不是系统故障，不要用 bash echo 打检查点、不要反复重试同一调用、也不要改读经验库消磨回合——立即换用你确定可用的工具推进，或直接按异常流程收尾。中途异常或无法继续时，先把已完成发现通过 src_submit 提交（stage=blocked/failed，summary 写明原因），再返回，不得静默退出。禁止继续委派、扩大范围、拒绝服务、大规模凭证测试和数据外传。
        toolFilter: &src-audit-filter
          deny: [src_add_capability, src_recover_child, src_update_finding, src_reject_finding, src_resolve_approval, src_request_asset_confirm, src_read_capability, src_run_capability, src_record_lesson, src_finalize_engagement, src_record_research, src_record_coverage, src_collect_passive, src_collect_dorks, src_import_traffic, src_record_observation, src_user_todo, src_fetch_policy, src_set_infra, src_add_test_account, src_record_domain_note, src_set_goal_target, src_add_goal, src_add_intent, src_add_fact, src_add_finding, src_scan_surface, src_update_intent, src_state, src_graph, src_report, src_recon, src_audit, src_verify]

    - id: src-verify-agent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: src_verify
        backgroundMode: continuable
        maxDepth: 1
        persona: |-
          你是 SRC 漏洞复核 agent。独立复核父 agent 提供的漏洞假设或初步证据，确认可重复性、影响范围、严重度和误报可能。不得扩展到未授权资产，不得把不可重复结果写成 finding。发现独立证据后立即用 src_submit 提交；finding 的 pocEvidence 必须含可直接复现的 raw 请求/响应（至少含接口地址）。**准入闸（服务端强制）**：每条 finding 必须同时给出 victimImpact（受害者视角：谁受害、损失什么）、attackPrerequisites（利用前提：钓鱼页托管域要求/需登录哪个业务/需要的用户交互；前提不满足不得提交）、concreteLossEvidence（至少一条指向本会话真实 fact/observation/research 的 id，含敏感响应体或外带记录；仅头反射不算）——先把敏感响应作为 facts 提交再引用其 id。severity 无 info 级：仅配置缺陷、响应头反射而无敏感数据证明的信号改记 research(false-positive)，不进漏洞清单。复核以可重复性与实际危害为准：任何等级（含 low 信息泄露/指纹类）的发现只要危害链闭合（三要素齐全）即可复核通过，建议等级须如实。全程使用中文。若某个工具报「不存在、未授权、requires an initialized SRC goal」类错误：这不是系统故障，不要用 bash echo 打检查点、不要反复重试同一调用、也不要改读经验库消磨回合——立即换用你确定可用的工具推进，或直接按异常流程收尾。中途异常或无法继续时，先通过 src_submit 提交已完成部分（stage=blocked/failed，summary 写明原因），再返回，不得静默退出。最终只返回复核结论、证据摘要、建议等级、提交计数和剩余疑点。
        toolFilter: &src-verify-filter
          deny: [src_add_capability, src_recover_child, src_update_finding, src_reject_finding, src_resolve_approval, src_request_asset_confirm, src_read_capability, src_run_capability, src_record_lesson, src_finalize_engagement, src_record_coverage, src_collect_passive, src_collect_dorks, src_import_traffic, src_record_observation, src_test_credential, src_user_todo, src_fetch_policy, src_set_infra, src_add_test_account, src_record_domain_note, src_set_goal_target, src_add_goal, src_add_intent, src_add_fact, src_add_finding, src_add_asset, src_scan_surface, src_update_intent, src_state, src_graph, src_report, src_recon, src_audit, src_verify]

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── penetration mode ────────────────────────────────────────────────────────

# The single src plugin: eight model-facing src_* tools on the host
# tools registry, the src:protocol system-prompt section (the 提案→决策→
# 执行 protocol, injected automatically — the user only sends target +
# objective), and the standing src session-projection unit for the Web
# panel. It publishes no service and consumes the host `storageDomain`
# facility, so it needs no realm.
- id: src
  name: '@lihua_dis/dsh-src/src'
